name: 'Pico Build'
description: 'Build Raspberry Pi Pico projects with pico-sdk and picotool'
author: 'Your Name'

branding:
  icon: 'cpu'
  color: 'green'

inputs:
  pico-sdk-version:
    description: 'Version/tag/branch of pico-sdk to use'
    required: false
    default: '2.2.0'
  picotool-version:
    description: 'Version/tag/branch of picotool to use'
    required: false
    default: '2.2.0'
  toolchain-version:
    description: 'ARM GCC toolchain version to use'
    required: false
    default: '14.2.rel1'
  cmake-args:
    description: 'Additional arguments to pass to cmake configure'
    required: false
    default: ''
  source-dir:
    description: 'Source directory containing CMakeLists.txt'
    required: false
    default: '.'
  build-dir:
    description: 'Build output directory (relative to source-dir if not absolute)'
    required: false
    default: 'build'

outputs:
  pico-sdk-path:
    description: 'Path to the installed pico-sdk'
    value: ${{ steps.setup-tools.outputs.pico-sdk-path }}
  picotool-path:
    description: 'Path to the installed picotool'
    value: ${{ steps.setup-tools.outputs.picotool-path }}
  toolchain-path:
    description: 'Path to the installed ARM GCC toolchain'
    value: ${{ steps.setup-tools.outputs.toolchain-path }}
  build-path:
    description: 'Path to the build directory'
    value: ${{ steps.build.outputs.build-path }}

runs:
  using: 'composite'
  steps:

    - name: Install PyYAML
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
    
    - name: Install Pico SDK Tools
      id: setup-tools
      shell: bash
      run: |
        python "${{ github.action_path }}/install.py" \
          --sdk-version "${{ inputs.pico-sdk-version }}" \
          --toolchain-version "${{ inputs.toolchain-version }}"

    - name: Configure and build project
      id: build
      shell: bash
      run: |
        SOURCE_DIR="${{ inputs.source-dir }}"
        BUILD_DIR="${{ inputs.build-dir }}"
        
        # Resolve source directory
        if [[ "$SOURCE_DIR" != /* ]] && [[ "$SOURCE_DIR" != *:* ]]; then
          SOURCE_DIR="${GITHUB_WORKSPACE}/${SOURCE_DIR}"
        fi
        
        # Resolve build directory
        if [[ "$BUILD_DIR" != /* ]] && [[ "$BUILD_DIR" != *:* ]]; then
          BUILD_DIR="${SOURCE_DIR}/${BUILD_DIR}"
        fi
        
        echo "Source directory: $SOURCE_DIR"
        echo "Build directory: $BUILD_DIR"
        
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"
        
        # Configure with cmake
        cmake "$SOURCE_DIR" \
          -DPICO_SDK_PATH="$PICO_SDK_PATH" \
          ${{ inputs.cmake-args }}
        
        # Build
        cmake --build . --config Release
        
        echo "build-path=$BUILD_DIR" >> $GITHUB_OUTPUT
