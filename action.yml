name: 'Pico Build'
description: 'Build Raspberry Pi Pico projects with pico-sdk and picotool'
author: 'Your Name'

branding:
  icon: 'cpu'
  color: 'green'

inputs:
  pico-sdk-version:
    description: 'Version/tag/branch of pico-sdk to use'
    required: false
    default: 'master'
  picotool-version:
    description: 'Version/tag/branch of picotool to use'
    required: false
    default: 'master'
  toolchain-version:
    description: 'ARM GCC toolchain version to use'
    required: false
    default: '13.2.rel1'
  cmake-args:
    description: 'Additional arguments to pass to cmake configure'
    required: false
    default: ''
  source-dir:
    description: 'Source directory containing CMakeLists.txt'
    required: false
    default: '.'
  build-dir:
    description: 'Build output directory (relative to source-dir if not absolute)'
    required: false
    default: 'build'

outputs:
  pico-sdk-path:
    description: 'Path to the installed pico-sdk'
    value: ${{ steps.setup-tools.outputs.pico-sdk-path }}
  picotool-path:
    description: 'Path to the installed picotool'
    value: ${{ steps.setup-tools.outputs.picotool-path }}
  toolchain-path:
    description: 'Path to the installed ARM GCC toolchain'
    value: ${{ steps.setup-tools.outputs.toolchain-path }}
  build-path:
    description: 'Path to the build directory'
    value: ${{ steps.build.outputs.build-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    
    - name: Install PyYAML
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
    
    - name: Install Pico SDK Tools
      id: setup-tools
      shell: bash
      run: |
        # Run the Python installer script
        python "${{ github.action_path }}/install.py" \
          --sdk-version "${{ inputs.pico-sdk-version }}" \
          --toolchain-version "${{ inputs.toolchain-version }}"
        
        # Set environment variables and outputs based on detected OS
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          INSTALL_DIR="$USERPROFILE/.pico-sdk"
        else
          INSTALL_DIR="$HOME/.pico-sdk"
        fi
        
        echo "PICO_SDK_PATH=$INSTALL_DIR/pico-sdk" >> $GITHUB_ENV
        echo "pico-sdk-path=$INSTALL_DIR/pico-sdk" >> $GITHUB_OUTPUT
        echo "picotool-path=$INSTALL_DIR/picotool" >> $GITHUB_OUTPUT
        echo "toolchain-path=$INSTALL_DIR/toolchain" >> $GITHUB_OUTPUT
        
        # Add tools to PATH
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "$INSTALL_DIR/openocd/bin" >> $GITHUB_PATH
          echo "$INSTALL_DIR/picotool" >> $GITHUB_PATH
          echo "$INSTALL_DIR/picosdktools" >> $GITHUB_PATH
          echo "$INSTALL_DIR/riscv-toolchain/bin" >> $GITHUB_PATH
        else
          echo "$INSTALL_DIR/openocd/bin" >> $GITHUB_PATH
          echo "$INSTALL_DIR/picotool/bin" >> $GITHUB_PATH
          echo "$INSTALL_DIR/picosdktools/pioasm" >> $GITHUB_PATH
          echo "$INSTALL_DIR/riscv-toolchain/bin" >> $GITHUB_PATH
        fi

    - name: Configure and build project
      id: build
      shell: bash
      run: |
        SOURCE_DIR="${{ inputs.source-dir }}"
        BUILD_DIR="${{ inputs.build-dir }}"
        
        # Resolve source directory
        if [[ "$SOURCE_DIR" != /* ]] && [[ "$SOURCE_DIR" != *:* ]]; then
          SOURCE_DIR="${GITHUB_WORKSPACE}/${SOURCE_DIR}"
        fi
        
        # Resolve build directory
        if [[ "$BUILD_DIR" != /* ]] && [[ "$BUILD_DIR" != *:* ]]; then
          BUILD_DIR="${SOURCE_DIR}/${BUILD_DIR}"
        fi
        
        echo "Source directory: $SOURCE_DIR"
        echo "Build directory: $BUILD_DIR"
        
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"
        
        # Configure with cmake
        cmake "$SOURCE_DIR" \
          -DPICO_SDK_PATH="$PICO_SDK_PATH" \
          ${{ inputs.cmake-args }}
        
        # Build
        cmake --build . --config Release
        
        echo "build-path=$BUILD_DIR" >> $GITHUB_OUTPUT
