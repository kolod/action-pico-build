name: Test Action

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]
  workflow_dispatch:

jobs:
  test-basic:
    name: Basic Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build Test Project
        id: build
        uses: ./
        with:
          source-dir: test
      
      - name: Verify Build Outputs (Bash)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Build path: ${{ steps.build.outputs.build-path }}"
          echo "SDK path: ${{ steps.build.outputs.pico-sdk-path }}"
          echo "Picotool path: ${{ steps.build.outputs.picotool-path }}"
          echo "Toolchain path: ${{ steps.build.outputs.toolchain-path }}"
          
          # Check if build directory exists
          if [ ! -d "${{ steps.build.outputs.build-path }}" ]; then
            echo "Error: Build directory not found"
            exit 1
          fi
          
          # Check if UF2 file was created
          if [ ! -f "${{ steps.build.outputs.build-path }}/test_project.uf2" ]; then
            echo "Error: UF2 file not found"
            exit 1
          fi
          
          echo "Build successful!"
      
      - name: Verify Build Outputs (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Build path: ${{ steps.build.outputs.build-path }}"
          Write-Host "SDK path: ${{ steps.build.outputs.pico-sdk-path }}"
          Write-Host "Picotool path: ${{ steps.build.outputs.picotool-path }}"
          Write-Host "Toolchain path: ${{ steps.build.outputs.toolchain-path }}"
          
          # Check if build directory exists
          if (-not (Test-Path "${{ steps.build.outputs.build-path }}")) {
            Write-Host "Error: Build directory not found"
            exit 1
          }
          
          # Check if UF2 file was created
          if (-not (Test-Path "${{ steps.build.outputs.build-path }}/test_project.uf2")) {
            Write-Host "Error: UF2 file not found"
            exit 1
          }
          
          Write-Host "Build successful!"
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.os }}
          path: ${{ steps.build.outputs.build-path }}/*.uf2

  test-toolchain-14-2:
    name: Toolchain 14.2.rel1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build with Toolchain 14.2.rel1
        id: build
        uses: ./
        with:
          source-dir: test
          toolchain-version: '14.2.rel1'
      
      - name: Verify Build and Toolchain (Bash)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Build path: ${{ steps.build.outputs.build-path }}"
          echo "Toolchain path: ${{ steps.build.outputs.toolchain-path }}"
          
          # Verify toolchain version
          arm-none-eabi-gcc --version
          
          # Check if build directory exists
          if [ ! -d "${{ steps.build.outputs.build-path }}" ]; then
            echo "Error: Build directory not found"
            exit 1
          fi
          
          # Check if UF2 file was created
          if [ ! -f "${{ steps.build.outputs.build-path }}/test_project.uf2" ]; then
            echo "Error: UF2 file not found"
            exit 1
          fi
          
          echo "Build with toolchain 14.2.rel1 successful!"
      
      - name: Verify Build and Toolchain (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Build path: ${{ steps.build.outputs.build-path }}"
          Write-Host "Toolchain path: ${{ steps.build.outputs.toolchain-path }}"
          
          # Verify toolchain version
          arm-none-eabi-gcc --version
          
          # Check if build directory exists
          if (-not (Test-Path "${{ steps.build.outputs.build-path }}")) {
            Write-Host "Error: Build directory not found"
            exit 1
          }
          
          # Check if UF2 file was created
          if (-not (Test-Path "${{ steps.build.outputs.build-path }}/test_project.uf2")) {
            Write-Host "Error: UF2 file not found"
            exit 1
          }
          
          Write-Host "Build with toolchain 14.2.rel1 successful!"
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.os }}-14.2
          path: ${{ steps.build.outputs.build-path }}/*.uf2

  test-custom-versions:
    name: Custom Versions (SDK 2.2.0, Picotool 2.2.0-a4, Toolchain 14.2.rel1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build with Custom Versions
        id: build
        uses: ./
        with:
          source-dir: test
          pico-sdk-version: '2.2.0'
          picotool-version: '2.2.0-a4'
          toolchain-version: '14.2.rel1'
      
      - name: Verify Build and Versions
        shell: bash
        run: |
          echo "Build path: ${{ steps.build.outputs.build-path }}"
          echo "SDK path: ${{ steps.build.outputs.pico-sdk-path }}"
          echo "Picotool path: ${{ steps.build.outputs.picotool-path }}"
          echo "Toolchain path: ${{ steps.build.outputs.toolchain-path }}"
          
          # Verify versions
          arm-none-eabi-gcc --version
          picotool version
          
          # Check if build directory exists
          if [ ! -d "${{ steps.build.outputs.build-path }}" ]; then
            echo "Error: Build directory not found"
            exit 1
          fi
          
          # Check if UF2 file was created
          if [ ! -f "${{ steps.build.outputs.build-path }}/test_project.uf2" ]; then
            echo "Error: UF2 file not found"
            exit 1
          fi
          
          echo "Build with custom versions successful!"
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-custom-versions
          path: ${{ steps.build.outputs.build-path }}/*.uf2

