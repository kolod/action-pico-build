name: Test Action

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]
  workflow_dispatch:

jobs:
  test-basic-ubuntu:
    name: Basic Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build Test Project
        id: build
        uses: ./
        with:
          source-dir: test
      
      - name: Verify Build Outputs
        shell: bash
        run: |
          echo "Build path: ${{ steps.build.outputs.build-path }}"
          echo "SDK path: ${{ steps.build.outputs.pico-sdk-path }}"
          echo "Picotool path: ${{ steps.build.outputs.picotool-path }}"
          
          # Check if build directory exists
          if [ ! -d "${{ steps.build.outputs.build-path }}" ]; then
            echo "Error: Build directory not found"
            exit 1
          fi
          
          # Check if UF2 file was created
          if [ ! -f "${{ steps.build.outputs.build-path }}/test_project.uf2" ]; then
            echo "Error: UF2 file not found"
            exit 1
          fi
          
          echo "Build successful!"
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-ubuntu
          path: ${{ steps.build.outputs.build-path }}/*.uf2

